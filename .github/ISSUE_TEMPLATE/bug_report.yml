name: Gameplay or display bug
description: Report a reproducible problem with a flight, control or screen.
title: "[Bug] "
labels: []
body:
  - type: input
    id: environment
    attributes:
      label: Device and browser
      placeholder: "Windows laptop, Chrome; or phone model and browser"
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Channel
      options:
        - Tidal Conduit
        - Prism Archive
        - Solar Relay
        - Menu or another screen
  - type: input
    id: quality
    attributes:
      label: Quality setting
      placeholder: "Auto, Low, Medium or High"
  - type: textarea
    id: steps
    attributes:
      label: What happened?
      description: Include the steps, what you expected and a screenshot if useful. Avoid private profile details.
    validations:
      required: true
